name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # config.js is gitignored and never committed — this step creates it
      # fresh inside the runner's workspace, from repo secrets, right before
      # packaging the site. It only ever exists in this ephemeral build.
      - name: Generate config.js from secrets
        env:
          NURSEPULSE_SUPABASE_URL: ${{ secrets.NURSEPULSE_SUPABASE_URL }}
          NURSEPULSE_SUPABASE_ANON_KEY: ${{ secrets.NURSEPULSE_SUPABASE_ANON_KEY }}
        run: bash scripts/generate-config.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
